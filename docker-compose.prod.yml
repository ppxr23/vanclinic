services:
  traefik:
    image: traefik:v3.7.11
    container_name: vanclinic_traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - vanclinic_prod

  database:
    image: postgres:16-alpine
    container_name: vanclinic_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: vanclinic
      POSTGRES_USER: vanclinic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - vanclinic_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanclinic"]
      interval: 5s
      timeout: 5s
      retries: 5

  php:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: vanclinic_backend_prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod.local
    environment:
      DATABASE_URL: postgresql://vanclinic:${POSTGRES_PASSWORD}@database:5432/vanclinic?serverVersion=16&charset=utf8
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - jwt_keys:/var/www/html/config/jwt
      - uploads_data:/var/www/html/public/uploads
    networks:
      - vanclinic_prod
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`))
      - traefik.http.routers.backend.priority=10
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls.certresolver=le
      - traefik.http.services.backend.loadbalancer.server.port=80

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: vanclinic_frontend_prod
    restart: unless-stopped
    networks:
      - vanclinic_prod
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.frontend.priority=1
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls.certresolver=le
      - traefik.http.services.frontend.loadbalancer.server.port=80

networks:
  vanclinic_prod:
    driver: bridge

volumes:
  postgres_prod_data:
  jwt_keys:
  uploads_data:
  traefik_letsencrypt:
